services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Talks to the local Postgres from the data repo (its `docker compose up` exposes 5432 on the host).
    # Defaults match the data repo's .env.example; override via a .env file next to this compose file.
    environment:
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    environment:
      ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api
